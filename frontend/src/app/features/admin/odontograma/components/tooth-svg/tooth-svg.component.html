<div class="flex w-14 select-none flex-col items-center gap-0.1">
  <svg
    viewBox="0 0 100 100"
    class="h-16 w-16 cursor-pointer transition-all duration-200 hover:scale-105"
    role="img"
  >
    <title>Pieza {{ pieza }}</title>

    <defs>
      <filter id="smoothRelief" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="1.8" result="blur" />
        <feSpecularLighting
          in="blur"
          surfaceScale="3"
          specularConstant="1.2"
          specularExponent="16"
          lighting-color="#ffffff"
          result="light"
        >
          <fePointLight x="30" y="20" z="40" />
        </feSpecularLighting>
        <feComposite in="light" in2="SourceAlpha" operator="in" result="litBlur" />
        <feComposite in="SourceGraphic" in2="litBlur" operator="over" />
      </filter>

      <filter id="fossaDepth" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow
          dx="0"
          dy="1.5"
          stdDeviation="1.5"
          flood-color="#8c7e6c"
          flood-opacity="0.35"
        />
      </filter>

      <radialGradient id="realEnamel" cx="45%" cy="42%" r="55%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="70%" stop-color="#fdfcf7" />
        <stop offset="100%" stop-color="#e8e2d5" />
      </radialGradient>
    </defs>

    <g filter="url(#smoothRelief)">
      <path
        d="M 28 24 
           C 42 19, 58 19, 72 24 
           C 83 29, 87 44, 84 60 
           C 81 74, 69 81, 50 81 
           C 31 81, 19 74, 16 60 
           C 13 44, 17 29, 28 24 Z"
        fill="url(#realEnamel)"
        [attr.stroke]="seleccionado ? '#2563eb' : '#dfd8cb'"
        [attr.stroke-width]="seleccionado ? '2.5' : '1'"
        stroke-linejoin="round"
      />

      <path
        d="M 28 24 C 42 19, 58 19, 72 24 L 64 39 C 55 35, 45 35, 36 39 Z"
        [attr.fill]="superficieHover() === 'Vestibular' ? '#dbeafe' : colorSuperficie('Vestibular')"
        [attr.stroke]="bordeSuperficie('Vestibular')"
        stroke-width="0.8"
        class="transition-colors duration-150"
        (click)="seleccionarSuperficie('Vestibular')"
        (mouseenter)="superficieHover.set('Vestibular')"
        (mouseleave)="superficieHover.set(null)"
      />

      <path
        d="M 72 24 C 83 29, 87 44, 84 60 L 69 55 C 72 48, 70 42, 64 39 Z"
        [attr.fill]="superficieHover() === 'Distal' ? '#dbeafe' : colorSuperficie('Distal')"
        [attr.stroke]="bordeSuperficie('Distal')"
        stroke-width="0.8"
        class="transition-colors duration-150"
        (click)="seleccionarSuperficie('Distal')"
        (mouseenter)="superficieHover.set('Distal')"
        (mouseleave)="superficieHover.set(null)"
      />

      <path
        d="M 84 60 C 81 74, 69 81, 50 81 C 31 81, 19 74, 16 60 L 36 55 C 44 59, 56 59, 64 55 Z"
        [attr.fill]="superficieHover() === 'Lingual' ? '#dbeafe' : colorSuperficie('Lingual')"
        [attr.stroke]="bordeSuperficie('Lingual')"
        stroke-width="0.8"
        class="transition-colors duration-150"
        (click)="seleccionarSuperficie('Lingual')"
        (mouseenter)="superficieHover.set('Lingual')"
        (mouseleave)="superficieHover.set(null)"
      />

      <path
        d="M 16 60 C 13 44, 17 29, 28 24 L 36 39 C 30 42, 28 48, 31 55 Z"
        [attr.fill]="superficieHover() === 'Mesial' ? '#dbeafe' : colorSuperficie('Mesial')"
        [attr.stroke]="bordeSuperficie('Mesial')"
        stroke-width="0.8"
        class="transition-colors duration-150"
        (click)="seleccionarSuperficie('Mesial')"
        (mouseenter)="superficieHover.set('Mesial')"
        (mouseleave)="superficieHover.set(null)"
      />

      <path
        d="M 36 39 C 45 35, 55 35, 64 39 C 70 42, 72 48, 69 55 C 56 59, 44 59, 36 55 C 28 48, 30 42, 36 39 Z"
        [attr.fill]="superficieHover() === 'Oclusal' ? '#bfdbfe' : colorSuperficie('Oclusal')"
        [attr.stroke]="bordeSuperficie('Oclusal')"
        stroke-width="1"
        filter="url(#fossaDepth)"
        class="transition-all duration-150"
        (click)="seleccionarSuperficie('Oclusal')"
        (mouseenter)="superficieHover.set('Oclusal')"
        (mouseleave)="superficieHover.set(null)"
      />

      <path
        d="M 45 44 Q 50 49, 55 44"
        fill="none"
        stroke="#beaf9a"
        stroke-width="0.8"
        opacity="0.6"
        pointer-events="none"
      />

      <path
        d="M 50 47 Q 50 52, 48 55"
        fill="none"
        stroke="#beaf9a"
        stroke-width="0.8"
        opacity="0.6"
        pointer-events="none"
      />
    </g>
  </svg>

  <span
    class="rounded px-1 py-0.5 text-[sm] font-bold tracking-tight transition-colors duration-150"
    [ngClass]="seleccionado ? 'bg-primary text-white' : 'bg-surface-main text-ink-muted'"
  >
    {{ pieza }}
  </span>
</div>
