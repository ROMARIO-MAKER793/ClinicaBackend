@if (toastService.toast(); as toast) {
  <div
    class="fixed right-5 top-5 z-[9999] rounded-xl px-5 py-3 text-sm font-medium shadow-xl transition-all duration-300"
    [ngClass]="obtenerClase(toast.tipo)"
  >
    <div class="flex items-center gap-3">
      <span>{{ toast.mensaje }}</span>

      <button
        type="button"
        (click)="toastService.cerrar()"
        class="text-white/80 hover:text-white"
      >
        ✕
      </button>
    </div>
  </div>
}
